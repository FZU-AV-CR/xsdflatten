[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xsdflatten"
version = "1.0.0"
authors = [
    {name = "Roman Dvořák", email = "roman.dvorak@fzu.cz"}
]
maintainers = [
    {name = "Roman Dvořák", email = "roman.dvorak@fzu.cz"}
]
description = "Python 3 script to flatten an XSD schema into a single document"
readme = "README.md"
requires-python = ">=3.6"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: XML",
]
dependencies = [
    "lxml>=4.6.0",
]

[project.urls]
"Homepage" = "https://github.com/FZU-AV-CR/xsdflatten"
"Bug Tracker" = "https://github.com/FZU-AV-CR/xsdflatten/issues"

[project.scripts]
xsdflatten = "xsdflatten:main"